name: RSS to WordPress Automation

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Evaluate without WordPress writes
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      single_feed:
        description: Optional feed name
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: alcorn-wordpress-publisher
  cancel-in-progress: false

jobs:
  process-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install and test
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q
          python -m ruff check src tests
      - run: mkdir -p data
      - name: Restore publishing history
        uses: actions/cache/restore@v4
        with:
          path: data/processed.db
          key: processed-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            processed-db-
      - name: Evaluate and publish qualifying articles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Variables override defaults; legacy nano model secrets are not used.
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-5.4-mini' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          MAX_CANDIDATES_PER_RUN: '6'
          MAX_POSTS_PER_RUN: '5'
          MAX_DRAFTS_PER_RUN: '3'
          WORDPRESS_BASE_URL: ${{ secrets.WORDPRESS_BASE_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_POST_STATUS: ${{ secrets.WORDPRESS_POST_STATUS || 'publish' }}
          WORDPRESS_AUTHOR_ID: '1'
          WORDPRESS_AUTHOR_NAME: Jon R Myers
          TIMEZONE: America/Chicago
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          SINGLE_FEED: ${{ inputs.single_feed }}
        shell: bash
        run: |
          args=(--config feeds.yaml)
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          if [[ -n "$SINGLE_FEED" ]]; then args+=(--single-feed "$SINGLE_FEED"); fi
          python -m rss_to_wp run "${args[@]}"
      - name: Preserve history even if a later article failed
        if: ${{ always() && inputs.dry_run != 'true' && hashFiles('data/processed.db') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/processed.db
          key: processed-db-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save editorial audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/*report.json
          if-no-files-found: ignore
          retention-days: 14
